*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Figtree','Segoe UI',Roboto,Arial,sans-serif;color:#f2f2f2}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:#000}
#stage>*,#dyn>*{position:absolute}
.pn>*,.bx>*{position:absolute}
.pn{background:#191919;border-radius:22px;overflow:hidden}
.pt{left:20px;top:14px;font-size:14px;font-weight:600;color:#f2f2f2;white-space:nowrap}
.mut{color:#8a8a8a}.ye{color:#f2c94c}
svg{display:block;overflow:visible}
svg text{font-family:'Figtree','Segoe UI',Arial,sans-serif}
.lang{width:42px;height:30px;line-height:30px;text-align:center;border-radius:15px;background:#1c1c1c;color:#9a9a9a;font-size:12.5px;font-weight:600;cursor:pointer}
.lang:hover{color:#fff}.lang.on{background:#f2c94c;color:#161616}
.chip{display:flex;align-items:center;justify-content:center;height:26px;border-radius:13px;background:#232323;color:#a8a8a8;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.chip:hover{color:#fff}
.chip.on{background:#f2c94c;color:#161616}
.chip.all{background:#3a3318;color:#f2d98a}
.chip.na{background:#161616;color:#4a4a4a;cursor:default}
.ib{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;color:#8d8d8d;cursor:pointer}
.ib:hover{color:#fff;background:#1c1c1c}.ib.on{background:#000;color:#fff;box-shadow:0 0 0 1px #2c2c2c}
.rb{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#262626;color:#d8d8d8;font-size:12px;font-weight:600;cursor:pointer}
.rb:hover{color:#fff}.rb.on{background:#f2c94c;color:#161616}
.pill{display:flex;align-items:center;justify-content:center;height:30px;border-radius:15px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer}
.pill.em{background:#242424;color:#e9e9e9}
.pill.yt{background:rgba(230,33,23,.14);color:#f2857d}.pill.li{background:rgba(10,102,194,.2);color:#7bb8ec}.pill.pf{background:rgba(242,201,76,.13);color:#e6c25f}.pill.wa{background:rgba(31,168,85,.15);color:#6bcf94}
.pill:hover{filter:brightness(1.3)}
.glass{background:rgba(18,18,18,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ov{display:flex;align-items:center;justify-content:center;height:34px;border-radius:8px;background:rgba(0,0,0,.82);font-size:13px;font-weight:600;color:#fff;cursor:pointer}
.hit{pointer-events:auto;cursor:pointer}
.rw{cursor:pointer}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#000;border:1px solid #3a3a3a;color:#f2f2f2;font:600 12.5px 'Figtree','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:8px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1300px,96vw);height:min(720px,88vh);background:#181818;border:1px solid #2e2e2e;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;font-family:'Figtree','Segoe UI',Arial,sans-serif}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#202020;border-bottom:1px solid #2e2e2e}
#sheet .tp b{flex:1;font-size:16px;color:#f2c94c}
#sheet button{height:30px;padding:0 14px;border:0;border-radius:15px;background:#2c2c2c;color:#fff;font-weight:600;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#f2c94c;color:#161616}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:12.5px;width:100%}
#sheet th{position:sticky;top:0;background:#202020;color:#f2d98a;padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid #333}
#sheet td{padding:5px 9px;border-bottom:1px solid #242424;text-align:right;color:#e8e8e8;white-space:nowrap}
#sheet th:nth-child(-n+3),#sheet td:nth-child(-n+3){text-align:left}
#sheet tr:nth-child(even) td{background:#1c1c1c}
#sheet td[contenteditable]:focus{outline:2px solid #f2c94c;background:#2e2810}
